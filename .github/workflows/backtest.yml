name: backtest
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all = download data and run; fetch = download data only; run = run on the saved data"
        default: "all"
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt lxml
      - name: Download market data
        if: inputs.mode != 'run'
        run: python backtest/fetch.py
      - name: Publish the data branch (kept off main; the backtest reads it)
        if: inputs.mode != 'run'
        run: |
          cd backtest/data
          git init -q -b backtest-data
          git config user.name "setup-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Backtest data $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" backtest-data
          rm -rf .git
      - name: Get the saved data
        if: inputs.mode == 'run'
        run: |
          git fetch --depth 1 origin backtest-data
          mkdir -p backtest/data
          git --work-tree=backtest/data checkout FETCH_HEAD -- .
          git reset -q
      - name: Run the backtest
        if: inputs.mode != 'fetch'
        run: |
          python backtest/engine.py --test
          python backtest/run.py
      - name: Commit results
        if: inputs.mode != 'fetch'
        run: |
          git config user.name "setup-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add results/backtest.md results/backtest.json
          git diff --cached --quiet || git commit -m "Backtest $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
