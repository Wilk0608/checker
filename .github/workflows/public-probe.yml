name: public-probe
# Run by hand to check the Public API option source (market data only).
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers separated by spaces"
        default: "LOW TEVA SLV NVDA"
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          PUBLIC_SECRET: ${{ secrets.PUBLIC_SECRET }}
        run: python tools/public_probe.py ${{ inputs.tickers }}
