name: daily-setup-scan
on:
  schedule:
    - cron: "17 21 * * 1-5"   # 21:17 UTC = 5:17 PM EDT / 4:17 PM EST, after every close (option spreads provisional)
    - cron: "7 15 * * 1-5"    # 15:07 UTC = 11:07 AM EDT / 10:07 AM EST: re-run on official closes with regular-hours option quotes
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:                  # one scan at a time: an overlapping run waits, so two runs never race to push results
  group: daily-setup-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04     # pinned: ubuntu-latest is migrating to a new image, which could break the Python setup
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scanner.py --test
      - run: python scanner.py
      - name: Commit results
        run: |
          git config user.name "setup-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Setup scan $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
