name: daily-setup-scan
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = 5:30 PM EDT / 4:30 PM EST, after every close
    - cron: "30 10 * * 2-6"   # 10:30 UTC = 6:30 AM EDT / 5:30 AM EST: re-run on official closes before the next session
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:                  # one scan at a time: an overlapping run waits, so two runs never race to push results
  group: daily-setup-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04     # pinned: ubuntu-latest is migrating to a new image, which could break the Python setup
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scanner.py --test
      - run: python scanner.py
      - name: Commit results
        run: |
          git config user.name "setup-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Setup scan $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
