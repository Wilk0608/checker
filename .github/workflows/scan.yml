name: daily-setup-scan
on:
  schedule:
    # GitHub starts scheduled runs hours late (5 to 9 hours here in November 2026), so a single well-timed cron never
    # lands inside the trading day. This fires every hour and gate.py lets two scans a day through: the first run that
    # starts inside the regular session and the first run after the close. The other runs stop in a few seconds.
    - cron: "7 6-22 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write            # the alert step opens an issue, which emails the repository owner
concurrency:                  # one scan at a time: an overlapping run waits, so two runs never race to push results
  group: daily-setup-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04     # pinned: ubuntu-latest is migrating to a new image, which could break the Python setup
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # the branch tip when the job starts, so the gate sees what an earlier run recorded
      - name: Gate (does this run scan?)
        id: gate
        run: python3 gate.py --event "${{ github.event_name }}" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.mode != 'skip'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.mode != 'skip'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.mode != 'skip'
        run: python scanner.py --test
      - if: steps.gate.outputs.mode != 'skip'
        run: python scanner.py
      - name: Record the scan (a failed scan is not recorded, so the next hourly run retries it)
        if: steps.gate.outputs.mode == 'regular' || steps.gate.outputs.mode == 'close'
        run: python3 gate.py --record "${{ steps.gate.outputs.mode }}" "${{ steps.gate.outputs.day }}"
      - name: Commit results
        if: steps.gate.outputs.mode != 'skip'
        run: |
          git config user.name "setup-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Setup scan $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
      - name: Raise an alert (GitHub issue) when the scan wrote one
        if: steps.gate.outputs.mode != 'skip' && hashFiles('results/alert.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(head -n 1 results/alert.md)"
          { tail -n +2 results/alert.md; echo; echo "@${{ github.repository_owner }}"; } > "$RUNNER_TEMP/alert_body.md"
          gh issue create --repo "${{ github.repository }}" --title "$title" --body-file "$RUNNER_TEMP/alert_body.md"
