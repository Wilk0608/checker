name: debug-feed
on: workflow_dispatch
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python debug_feed.py
      - run: |
          git config user.name setup-scanner; git config user.email actions@users.noreply.github.com
          git add results/debug_feed.txt; git commit -m "feed debug" && git push
