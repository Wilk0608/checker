name: data-source-probe
# Run by hand to check the Yahoo earnings-date lookup from a GitHub runner.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers separated by spaces (empty = the open shadows' tickers)"
        default: ""
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/earnings_probe.py ${{ inputs.tickers }}
