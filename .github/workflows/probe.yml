name: data-source-probe
on:
  push:
    branches: [option-screen]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python probe.py
      - name: Push the probe output to the probe branch
        run: |
          git config user.name "setup-scanner"
          git config user.email "actions@users.noreply.github.com"
          mv probe_out /tmp/probe_out
          git checkout --orphan probe-out
          git rm -rf -q .
          cp -r /tmp/probe_out .
          git add probe_out
          git commit -qm "probe $(date -u +%H:%M)"
          git push -f origin probe-out:probe
